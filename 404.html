<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | Veridian</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <style>
    :root { --ink: #161616; --muted: #4f4f4f; --blue: #0f52a2; --blue-dark: #0c4283; --border: #e6e6e6; --band: #f5f5f4; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #fff; color: var(--ink); padding: 24px 16px;
      font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      line-height: 1.55;
    }
    main { max-width: 560px; text-align: center; }
    .code { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
    h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 600; margin: 12px 0 16px; text-wrap: balance; }
    p { color: var(--muted); margin-bottom: 28px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a.btn { display: inline-block; padding: 12px 22px; border-radius: 6px; font-weight: 600; text-decoration: none; }
    a.primary { background: var(--blue); color: #fff; }
    a.primary:hover { background: var(--blue-dark); }
    a.outline { border: 1px solid var(--border); color: var(--ink); background: var(--band); }
    a.outline:hover { border-color: #d1d1d1; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>No encontramos esta página</h1>
    <p>Puede que la dirección haya cambiado. Desde acá podés volver al inicio, leer las guías o pedir una demo de SIG.</p>
    <div class="actions">
      <a class="btn primary" href="/">Ir al inicio</a>
      <a class="btn outline" href="/blog/">Ver las guías</a>
      <a class="btn outline" href="/demo/">Solicitar una demo</a>
    </div>
  </main>
</body>
</html>
